<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ business_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('home') }}">🌸 {{ business_name }}</a>
  <nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('cart') }}">Cart 🛒</a>
    <a href="{{ url_for('track') }}">Track Order</a>
    <a class="whatsapp" href="https://wa.me/{{ whatsapp }}" target="_blank">WhatsApp</a>
  </nav>
</header>
{% with messages = get_flashed_messages() %}
{% if messages %}<div class="flash">{% for m in messages %}{{ m }}{% endfor %}</div>{% endif %}
{% endwith %}
<main>{% block content %}{% endblock %}</main>
<footer>
  <strong>{{ business_name }}</strong><br>
  {{ location }} · <a href="https://wa.me/{{ whatsapp }}" target="_blank">WhatsApp: +91 8951104898</a>
</footer>
</body>
</html>
